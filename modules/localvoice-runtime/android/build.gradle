plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.localvoiceruntime'
version = '0.1.0'

dependencies {
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}

android {
  namespace "expo.modules.localvoiceruntime"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
